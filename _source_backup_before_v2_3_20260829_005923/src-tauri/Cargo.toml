[package]
name = "finance_tracker_v2"
version = "2.2.0"
description = "Local-first personal finance tracker"
authors = ["Local Finance Tracker"]
edition = "2021"

[lib]
name = "finance_tracker_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-updater = "2.10"
url = "2"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
tauri-plugin-biometry = "0.2.6"
