name: Publish Finance Tracker macOS

on:
  workflow_dispatch:

jobs:
  publish-macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: Apple Silicon
          - target: x86_64-apple-darwin
            label: Intel

    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Generate application icons
        run: npm run tauri icon src-tauri/icons/app-icon.png

      - name: Build signed updater artifacts and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FINANCE_UPDATER_PUBKEY: ${{ vars.FINANCE_UPDATER_PUBKEY }}
          FINANCE_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: app-v__VERSION__
          releaseName: 'Finance Tracker v__VERSION__'
          releaseBody: 'Signed Finance Tracker update. Existing local finance data is preserved.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }}
